services:
  greeter:
    build: ./greeter
    restart: unless-stopped
    ports:
      - 9292:9292
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MODEL=${MODEL:-claude-sonnet-4-20250514}

  translator:
    build: ./translator
    restart: unless-stopped
    ports:
      - 9293:9293
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MODEL=${MODEL:-claude-sonnet-4-20250514}

  host:
    build: ./host
    restart: unless-stopped
    ports:
      - 9294:9294
    depends_on:
      - greeter
      - translator
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MODEL=${MODEL:-claude-sonnet-4-20250514}
