name: Slow Worker
description: An async agent that processes jobs in the background with progress updates.
version: "1.0.0"
supportedInterfaces:
  - url: http://localhost:9292/a2a
    protocolBinding: JSONRPC
    protocolVersion: "1.0"
  - url: http://localhost:9292
    protocolBinding: HTTP+JSON
    protocolVersion: "1.0"
capabilities:
  streaming: true
  pushNotifications: false
defaultInputModes:
  - text/plain
defaultOutputModes:
  - text/plain
skills:
  - id: analyze
    name: Data Analyzer
    description: Performs long-running analysis with progress updates. Supports async mode via returnImmediately.
    tags:
      - analysis
      - async
      - background
    examples:
      - Analyze this dataset
      - Process the logs
